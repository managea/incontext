# Publishes the extension to the Visual Studio Marketplace and to Open VSX (the registry Cursor uses).
#
# To release: bump "version" in package.json, add a changelog entry, commit, then push a matching tag:
#   git tag v1.2.0 && git push origin main v1.2.0
# A tag ending in -pre publishes a pre-release instead, which only installs that switched to pre-release get:
#   git tag v2.1.0-pre && git push origin main v2.1.0-pre
# Pre-releases use odd minor versions (2.1.x) and releases even ones (2.0.x, 2.2.x), as the Marketplace recommends,
# so a pre-release never takes a version a release needs. See RELEASING.md.
#
# No Marketplace token is stored anywhere. The job signs in to Azure as the managed identity
# incontext-publisher (resource group incontext-publishing) through a federated credential that trusts
# this repository's "marketplace" environment, and vsce publishes as that identity.
# Open VSX uses the OVSX_PAT secret when set, otherwise ovsx trusted publishing. It only runs when the
# environment variable OPEN_VSX_ENABLED is true.
# Both publish steps skip a version the registry already has, so a failed release can simply be re-run.
# After publishing, the obsidian job attaches the Obsidian plugin (obsidian/) to a GitHub release for the tag,
# where BRAT and manual installs get it from.
#
# One-time setup: run this workflow manually with "lookup-identity" ticked to print the identity's ID,
# then add that ID as a Contributor member of the managea publisher on the Marketplace.

name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      lookup-identity:
        description: Only print the managed identity's Marketplace ID (one-time setup)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # lets the job sign in to Azure and Open VSX with GitHub's OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vsce 4 and ovsx 1.3 require Node 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        id: kind
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          minor="$(node -p "require('./package.json').version.split('.')[1]")"
          if [ "$GITHUB_REF_NAME" = "$version-pre" ]; then
            if [ $((minor % 2)) -ne 1 ]; then
              echo "::error::Pre-release $version needs an odd minor version (such as 2.1.x); even ones are for releases"
              exit 1
            fi
            echo "flag=--pre-release" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "$version" ]; then
            if [ $((minor % 2)) -ne 0 ]; then
              echo "::error::Release $version needs an even minor version (such as 2.2.0); odd ones are for pre-releases"
              exit 1
            fi
          else
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (or $version-pre for a pre-release)"
            exit 1
          fi

      - name: Sign in to Azure as the managed identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Print the managed identity's Marketplace ID
        if: inputs.lookup-identity
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798

      - name: Package
        if: ${{ !inputs.lookup-identity }}
        run: npx --yes @vscode/vsce@4.0.0 package ${{ steps.kind.outputs.flag }} --out incontext.vsix

      - name: Publish to the Visual Studio Marketplace
        if: ${{ !inputs.lookup-identity }}
        run: npx --yes @vscode/vsce@4.0.0 publish ${{ steps.kind.outputs.flag }} --azure-credential --skip-duplicate --packagePath incontext.vsix

      # Runs while the marketplace environment variable OPEN_VSX_ENABLED is true (on since 1.6.0). A pre-release
      # package says so in its manifest, which Open VSX reads
      - name: Publish to Open VSX
        if: ${{ !inputs.lookup-identity && vars.OPEN_VSX_ENABLED == 'true' }}
        run: npx --yes ovsx@1.3.0 publish --skip-duplicate --packagePath incontext.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # Releases only: BRAT and manual installs take the latest GitHub release, so pre-releases don't get one
  obsidian:
    if: ${{ github.ref_type == 'tag' && !endsWith(github.ref_name, '-pre') && !inputs.lookup-identity }}
    needs: publish # which checks the tag against package.json, the version the plugin's manifest gets
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:obsidian

      # Re-running only replaces the files, so a release someone already edited keeps its notes
      - name: Attach the plugin to the tag's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" dist/obsidian/main.js dist/obsidian/manifest.json dist/obsidian/styles.css --clobber
